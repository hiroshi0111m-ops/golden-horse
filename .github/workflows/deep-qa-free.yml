name: GOLDEN HORSE deep QA free

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install free QA tools
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Run multi-device + accessibility QA
        continue-on-error: true
        run: timeout 90s node scripts/gh_deep_qa.mjs

      - name: Upload deep QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-deep-qa
          path: |
            deep-qa-report.json
            deep-qa-*.png
          if-no-files-found: ignore
          retention-days: 3
