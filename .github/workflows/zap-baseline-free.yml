name: OWASP ZAP free baseline scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Scan target URL (use current DEV/public URL)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: golden-horse-zap-baseline
          cmd_options: "-m 1 -a"
