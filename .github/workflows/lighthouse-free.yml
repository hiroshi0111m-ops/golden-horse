name: Lighthouse free diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - "v*-dev"
      - "v*-runtime-*"
    paths:
      - "checkpoints/**/index.html"
      - "lighthouserc.cjs"
      - "scripts/serve_golden_horse.py"

concurrency:
  group: lighthouse-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse diagnostics
        continue-on-error: true
        run: lhci autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 3
