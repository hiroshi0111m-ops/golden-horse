name: GOLDEN HORSE V174 final tabs TDD

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v174-final-five-tabs"
    paths:
      - "scripts/gh_final_tabs_contract.py"
      - "scripts/gh_final_tabs_runtime.mjs"
      - "scripts/create_v174_final_tabs_fix.py"
      - "scripts/create_v173_mobile_nav_fix.py"
      - "scripts/gh_mobile_nav_runtime.mjs"
      - "scripts/run_test_with_url.mjs"
      - "scripts/gh_client_matrix.mjs"
      - "scripts/gh_3cycle_runtime.mjs"
      - "scripts/serve_golden_horse.py"
      - "scripts/gh_serve_active_index_test.py"
      - "RUN_V174_PHONE_TEST_FREE.bat"
      - ".github/workflows/v174-phone-preview-tooling.yml"
      - ".github/workflows/v174-final-tabs.yml"

permissions:
  contents: read

jobs:
  final-tabs-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
          node -e "console.log('CHROME_BIN='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Generate V174 and run mandatory preflight
        env:
          GH_ACTIVE_INDEX: checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: |
          python scripts/create_v174_final_tabs_fix.py
          python scripts/gh_preflight.py

      - name: Verify required final five tabs statically
        env:
          GH_ACTIVE_INDEX: checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: python scripts/gh_final_tabs_contract.py

      - name: Verify exact phone-preview checkpoint selection
        run: python scripts/gh_serve_active_index_test.py

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Verify required five-tab navigation at 390px
        env:
          GH_FINAL_TABS_URL: http://127.0.0.1:4173/checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: node scripts/gh_final_tabs_runtime.mjs

      - name: Recheck V173 mobile safe-area fix
        env:
          GH_MOBILE_NAV_URL: http://127.0.0.1:4173/checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: node scripts/gh_mobile_nav_runtime.mjs

      - name: Run Android LINE-simulated and iPhone full race matrix
        env:
          GH_TEST_URL: http://127.0.0.1:4173/checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: timeout 700s node scripts/run_test_with_url.mjs scripts/gh_client_matrix.mjs

      - name: Run three consecutive races on V174
        env:
          GH_TEST_URL: http://127.0.0.1:4173/checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: timeout 500s node scripts/run_test_with_url.mjs scripts/gh_3cycle_runtime.mjs

      - name: Upload V174 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v174-final-tabs-green
          path: |
            gh-checkpoint-manifest.json
            final-tabs-runtime-report.json
            final-tabs-390*.png
            mobile-nav-report.json
            mobile-nav-390*.png
            client-matrix-report.json
            client-matrix-*.png
            three-cycle-runtime-report.json
            three-cycle-*.png
            checkpoints/V174_FINAL_FIVE_TABS/index.html
          if-no-files-found: ignore
          retention-days: 3
