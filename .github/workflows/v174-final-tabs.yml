name: GOLDEN HORSE V174 final tabs TDD

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v174-final-five-tabs"
    paths:
      - "scripts/gh_final_tabs_contract.py"
      - "scripts/create_v174_final_tabs_fix.py"
      - "scripts/create_v173_mobile_nav_fix.py"
      - ".github/workflows/v174-final-tabs.yml"
      - "scripts/gh_final_tabs_runtime.mjs"

permissions:
  contents: read

jobs:
  final-tabs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate current V173 baseline
        env:
          GH_ACTIVE_INDEX: checkpoints/V173_MOBILE_NAV_SAFE_AREA/index.html
        run: python scripts/create_v173_mobile_nav_fix.py

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: RED runtime for required five tabs
        env:
          GH_FINAL_TABS_URL: http://127.0.0.1:4173/checkpoints/V173_MOBILE_NAV_SAFE_AREA/index.html
        run: node scripts/gh_final_tabs_runtime.mjs

      - name: Verify required final five tabs
        env:
          GH_ACTIVE_INDEX: checkpoints/V173_MOBILE_NAV_SAFE_AREA/index.html
        run: python scripts/gh_final_tabs_contract.py

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v174-final-tabs-red
          path: |
            final-tabs-runtime-report.json
            final-tabs-390*.png
          if-no-files-found: ignore
          retention-days: 3
