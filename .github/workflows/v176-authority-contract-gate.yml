name: GOLDEN HORSE V176 authority contract gate

on:
  push:
    branches:
      - automation/v176-authority-contract-gate
    paths:
      - contracts/golden_horse_authoritative_state_v1.json
      - scripts/gh_authority_contract_gate.py
      - .github/workflows/v176-authority-contract-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-blocker:
    name: Authority contract valid / backend blocker proven
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact V176 and mandatory guards
        env:
          GH_ACTIVE_INDEX: checkpoints/V176_LINE_LIFECYCLE_FIX/index.html
        run: |
          python scripts/create_v176_line_lifecycle_fix.py
          python scripts/gh_v176_line_lifecycle_contract.py
          python scripts/gh_preflight.py
          python scripts/gh_free_automation_status_contract.py

      - name: Validate authority contract
        run: |
          python -m py_compile scripts/gh_authority_contract_gate.py
          python scripts/gh_authority_contract_gate.py

      - name: Prove backend implementation is still an RC blocker
        run: |
          set +e
          python scripts/gh_authority_contract_gate.py --require-implementation
          gate_rc=$?
          set -e
          if [ "$gate_rc" -ne 2 ]; then
            echo "Expected missing-backend blocker exit 2, got $gate_rc"
            exit 1
          fi
          echo "Confirmed: contract is valid, but authoritative backend implementation is missing."

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v176-authority-contract-readiness
          path: authority-contract-readiness-report.json
          if-no-files-found: error
          retention-days: 7
