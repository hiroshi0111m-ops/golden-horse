name: GOLDEN HORSE three-cycle runtime

on:
  push:
    branches:
      - "automation/v169-timing-contract"
    paths:
      - "scripts/gh_3cycle_runtime.mjs"
      - "scripts/create_v169_race_loop_fix.py"
      - "scripts/create_v170_race_timing_fix.py"
      - ".github/workflows/three-cycle-runtime.yml"
      - "checkpoints/V168_BOOT_LOOP_FIX/index.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-three-cycle-runtime
  cancel-in-progress: true

jobs:
  three-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save playwright-core
      - run: python scripts/create_v170_race_timing_fix.py
      - run: python scripts/gh_preflight.py
        env:
          GH_ACTIVE_INDEX: checkpoints/V170_RACE_TIMING_FIX/index.html
      - name: Run three complete races without reload
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/gh-3cycle-http.log 2>&1 &
          sleep 1
          timeout 650s node scripts/gh_3cycle_runtime.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-three-cycle-runtime
          path: |
            three-cycle-runtime-report.json
            three-cycle-failure.png
            checkpoints/V170_RACE_TIMING_FIX/index.html
          if-no-files-found: ignore
          retention-days: 7
