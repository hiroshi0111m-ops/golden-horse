name: zizmor free workflow security

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/**"
      - "v*-dev"
      - "v*-runtime-*"
      - "main"

concurrency:
  group: zizmor-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install zizmor 1.30.1
        run: python -m pip install --disable-pip-version-check zizmor==1.30.1

      - name: Audit GitHub Actions workflows
        continue-on-error: true
        run: zizmor --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
