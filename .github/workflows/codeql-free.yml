name: CodeQL free security scan

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"
  push:
    branches:
      - "v*-dev"
      - "v*-runtime-*"
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"

concurrency:
  group: codeql-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
