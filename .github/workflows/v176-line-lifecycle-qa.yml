name: GOLDEN HORSE V176 line lifecycle QA
run-name: V176 line lifecycle QA @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v174-two-tab-concurrent-bet-qa"
    paths:
      - "scripts/create_v176_line_lifecycle_fix.py"
      - "scripts/gh_v176_line_lifecycle_contract.py"
      - "scripts/create_v175_multitab_lifecycle_fix.py"
      - "scripts/gh_two_tab_concurrent_bet_qa.mjs"
      - "scripts/create_v174_final_tabs_fix.py"
      - "scripts/create_v173_mobile_nav_fix.py"
      - ".github/workflows/v176-line-lifecycle-qa.yml"
      - "FREE_AUTOMATION_STATUS.md"
      - "scripts/gh_free_automation_status_contract.py"

concurrency:
  group: v176-line-lifecycle-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  v176-line-lifecycle-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate exact V176 and run mandatory guards
        env:
          GH_ACTIVE_INDEX: checkpoints/V176_LINE_LIFECYCLE_FIX/index.html
        run: |
          python scripts/create_v176_line_lifecycle_fix.py
          python scripts/gh_v176_line_lifecycle_contract.py
          python scripts/gh_preflight.py
          python scripts/gh_free_automation_status_contract.py

      - name: Start isolated V176 server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Require three consecutive two-tab settlement passes
        env:
          GH_TEST_URL: http://127.0.0.1:4173/checkpoints/V176_LINE_LIFECYCLE_FIX/index.html
        run: |
          for attempt in 1 2 3; do
            echo "V176_TWO_TAB_ATTEMPT=$attempt"
            timeout 300s node scripts/gh_two_tab_concurrent_bet_qa.mjs
            cp two-tab-concurrent-bet-qa-report.json "two-tab-concurrent-bet-qa-report-$attempt.json"
          done

      - name: Upload V176 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v176-line-lifecycle-qa
          path: |
            two-tab-concurrent-bet-qa-report*.json
            two-tab-concurrent-bet-*.png
          if-no-files-found: ignore
          retention-days: 7
