name: GitHub Pages free deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout GOLDEN HORSE V166
        uses: actions/checkout@v6
        with:
          ref: v166-reward-idempotency-ledger-dev

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp checkpoints/V166_REWARD_IDEMPOTENCY_LEDGER/index.html _site/index.html
          echo "Prepared $(wc -c < _site/index.html) bytes"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
