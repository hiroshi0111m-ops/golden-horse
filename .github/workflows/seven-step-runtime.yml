name: GOLDEN HORSE seven-step runtime

on:
  push:
    branches:
      - "v168-boot-loop-fix-dev"
      - "automation/v168-confirmed-race-test"
      - "automation/v169-timing-contract"
    paths:
      - "scripts/gh_7step_runtime.mjs"
      - "scripts/create_v169_race_loop_fix.py"
      - "scripts/create_v170_race_timing_fix.py"
      - ".github/workflows/seven-step-runtime.yml"
      - "checkpoints/V168_BOOT_LOOP_FIX/index.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-seven-step-runtime
  cancel-in-progress: true

jobs:
  seven-step:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - id: chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save playwright-core
      - run: python scripts/create_v170_race_timing_fix.py
      - run: python scripts/gh_preflight.py
        env:
          GH_ACTIVE_INDEX: checkpoints/V170_RACE_TIMING_FIX/index.html
      - run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/gh-7step-http.log 2>&1 &
          sleep 1
      - name: Run full guest race flow
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: timeout 130s node scripts/gh_7step_runtime.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-seven-step-runtime
          path: |
            seven-step-runtime-report.json
            seven-step-*.png
            checkpoints/V170_RACE_TIMING_FIX/index.html
          if-no-files-found: ignore
          retention-days: 3
