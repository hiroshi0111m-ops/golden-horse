name: GOLDEN HORSE free live monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check GitHub V166 source is retrievable
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL="https://raw.githubusercontent.com/hiroshi0111m-ops/golden-horse/v166-reward-idempotency-ledger-dev/checkpoints/V166_REWARD_IDEMPOTENCY_LEDGER/index.html"
          FILE="/tmp/golden-horse-source.html"

          curl -L --fail --silent --show-error --max-time 60 --retry 2 "$SOURCE_URL" -o "$FILE"

          BYTES="$(wc -c < "$FILE" | tr -d ' ')"
          SHA="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "SOURCE_HTTP=PASS"
          echo "SOURCE_BYTES=$BYTES"
          echo "SOURCE_SHA256=$SHA"

          EXPECTED_SHA="0de728faaaa8a7f9b5e726bd0d014972128f44fa049714636ff8820c513fcfe9"
          if [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL: immutable V166 source checksum changed"
            exit 1
          fi

          if [ "$BYTES" -lt 1800000 ]; then
            echo "FAIL: source file is unexpectedly small"
            exit 1
          fi

          echo "SOURCE_MONITOR=PASS"

      - name: Check PageShare DEV if currently active
        shell: bash
        run: |
          set -euo pipefail

          URL="https://misty-horizon-1435.hosted.pageshare.ai/"
          CODE="$(curl -L --silent --output /tmp/golden-horse-live.html --write-out '%{http_code}' --max-time 30 "$URL" || true)"

          echo "PAGESHARE_HTTP=$CODE"

          if [ "$CODE" = "200" ]; then
            BYTES="$(wc -c < /tmp/golden-horse-live.html | tr -d ' ')"
            echo "PAGESHARE_BYTES=$BYTES"
            if [ "$BYTES" -lt 1800000 ]; then
              echo "FAIL: live PageShare page is unexpectedly small"
              exit 1
            fi
            echo "PAGESHARE_LIVE=PASS"
          else
            echo "PAGESHARE_LIVE=INACTIVE_OR_EXPIRED"
            echo "This does not fail source health. A permanent free host can replace it later."
          fi

      - name: Check legacy Netlify backup
        shell: bash
        run: |
          set -euo pipefail

          URL="https://golden-horse-live-game.netlify.app/"
          CODE="$(curl -L --silent --output /tmp/golden-horse-netlify.html --write-out '%{http_code}' --max-time 30 "$URL" || true)"
          echo "NETLIFY_LEGACY_HTTP=$CODE"

          if [ "$CODE" = "200" ]; then
            BYTES="$(wc -c < /tmp/golden-horse-netlify.html | tr -d ' ')"
            echo "NETLIFY_LEGACY_BYTES=$BYTES"
            echo "NETLIFY_LEGACY=AVAILABLE"
          else
            echo "NETLIFY_LEGACY=UNAVAILABLE"
          fi

          echo "This is a legacy backup only and is not treated as the current V166 DEV."

      - name: Audit HTTP security headers
        shell: bash
        run: |
          set -euo pipefail

          audit_headers () {
            NAME="$1"
            URL="$2"
            HEADER_FILE="/tmp/$NAME-headers.txt"

            CODE="$(curl -L -sS -D "$HEADER_FILE" -o /dev/null --max-time 30 -w '%{http_code}' "$URL" || true)"
            echo "$NAME HTTP=$CODE"

            if [ "$CODE" != "200" ]; then
              echo "$NAME HEADER_AUDIT=SKIPPED"
              return 0
            fi

            for H in               "strict-transport-security"               "content-security-policy"               "x-content-type-options"               "referrer-policy"               "permissions-policy"
            do
              if grep -qi "^$H:" "$HEADER_FILE"; then
                echo "$NAME $H=PASS"
              else
                echo "$NAME $H=MISSING"
              fi
            done
          }

          audit_headers "NETLIFY_LEGACY" "https://golden-horse-live-game.netlify.app/"
          audit_headers "PAGESHARE_DEV" "https://misty-horizon-1435.hosted.pageshare.ai/"

          echo "HEADER_AUDIT=REPORT_ONLY"
