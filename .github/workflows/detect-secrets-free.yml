name: detect-secrets free scan

on:
  workflow_dispatch:
  schedule:
    - cron: "7 19 * * *"
  push:
    branches:
      - "v*-dev"
      - "v*-runtime-*"
    paths:
      - "checkpoints/**"
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - ".env*"
      - ".github/workflows/detect-secrets-free.yml"

concurrency:
  group: detect-secrets-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets

      - name: Scan repository
        run: detect-secrets scan --all-files > detect-secrets-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-detect-secrets
          path: detect-secrets-report.json
          if-no-files-found: ignore
          retention-days: 3
