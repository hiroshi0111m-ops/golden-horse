name: GOLDEN HORSE client matrix free

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v169-timing-contract"
    paths:
      - "scripts/gh_client_matrix.mjs"
      - "scripts/create_v171_three_cycle_fix.py"
      - ".github/workflows/client-matrix-free.yml"
      - "checkpoints/V168_BOOT_LOOP_FIX/index.html"

permissions:
  contents: read

jobs:
  client-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Generate V171 and run preflight
        env:
          GH_ACTIVE_INDEX: checkpoints/V171_THREE_CYCLE_FIX/index.html
        run: |
          python scripts/create_v171_three_cycle_fix.py
          python scripts/gh_preflight.py

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Run Android / LINE-simulated / iPhone matrix
        run: timeout 700s node scripts/gh_client_matrix.mjs

      - name: Upload client matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-client-matrix
          path: |
            client-matrix-report.json
            client-matrix-*.png
            checkpoints/V171_THREE_CYCLE_FIX/index.html
          if-no-files-found: ignore
          retention-days: 3
