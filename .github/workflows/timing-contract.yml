name: GOLDEN HORSE timing contract

on:
  push:
    branches:
      - "automation/v169-timing-contract"
    paths:
      - "scripts/gh_timing_contract.mjs"
      - "scripts/create_v169_race_loop_fix.py"
      - "scripts/create_v170_race_timing_fix.py"
      - "checkpoints/V168_BOOT_LOOP_FIX/index.html"
      - ".github/workflows/timing-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save playwright-core
      - run: python scripts/create_v170_race_timing_fix.py
      - name: Measure locked race timing
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/gh-timing-http.log 2>&1 &
          sleep 1
          node scripts/gh_timing_contract.mjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-timing-contract
          path: timing-contract-report.json
          if-no-files-found: error
          retention-days: 7
