name: GOLDEN HORSE fast runtime

on:
  push:
    branches:
      - "v167-boot-perf-dev"
      - "v168-boot-loop-fix-dev"
      - "v169-*-dev"
    paths:
      - "scripts/gh_runtime_fast.mjs"
      - "checkpoints/V167_BOOT_PERF/index.html"
      - ".github/workflows/runtime-fast.yml"
  workflow_dispatch:

concurrency:
  group: gh-fast-runtime-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate system Chrome
        id: chrome
        shell: bash
        run: |
          set -e
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"
          "$CHROME_BIN" --version

      - name: Install lightweight Playwright core
        run: npm install --no-save playwright-core

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/gh-fast-http.log 2>&1 &
          sleep 1

      - name: Fast Android runtime smoke
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: timeout 25s node scripts/gh_runtime_fast.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-fast-runtime
          path: fast-runtime.png
          if-no-files-found: ignore
          retention-days: 2
