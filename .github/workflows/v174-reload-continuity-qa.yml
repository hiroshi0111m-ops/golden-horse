name: GOLDEN HORSE V174 reload continuity QA

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v174-reload-continuity-qa"
    paths:
      - "scripts/gh_reload_continuity_qa.mjs"
      - ".github/workflows/v174-reload-continuity-qa.yml"
      - "FREE_AUTOMATION_STATUS.md"
      - "scripts/gh_free_automation_status_contract.py"
      - "scripts/create_v174_final_tabs_fix.py"
      - "scripts/gh_preflight.py"
      - "docs/superpowers/plans/2026-10-17-v174-reload-continuity-qa.md"

permissions:
  contents: read

jobs:
  reload-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate exact V174 and run mandatory preflight
        env:
          GH_ACTIVE_INDEX: checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: |
          python scripts/create_v174_final_tabs_fix.py
          python scripts/gh_preflight.py

      - name: Validate canonical handoff status
        run: python scripts/gh_free_automation_status_contract.py

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Verify accepted and settled state across reloads
        env:
          GH_TEST_URL: http://127.0.0.1:4173/checkpoints/V174_FINAL_FIVE_TABS/index.html
        run: timeout 300s node scripts/gh_reload_continuity_qa.mjs

      - name: Upload reload-continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v174-reload-continuity
          path: |
            reload-continuity-qa-report.json
            reload-continuity-*.png
            gh-checkpoint-manifest.json
          if-no-files-found: ignore
          retention-days: 7
