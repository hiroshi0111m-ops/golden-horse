name: GOLDEN HORSE V173 mobile nav TDD

on:
  workflow_dispatch:
  push:
    branches:
      - "automation/v173-mobile-nav-safe-area"
    paths:
      - "scripts/gh_mobile_nav_runtime.mjs"
      - "scripts/create_v173_mobile_nav_fix.py"
      - ".github/workflows/v173-mobile-nav.yml"
      - "scripts/create_v172_csp_image_fix.py"
      - "scripts/create_v171_three_cycle_fix.py"
      - "scripts/create_v170_race_timing_fix.py"
      - "scripts/create_v169_race_loop_fix.py"
      - "checkpoints/V168_BOOT_LOOP_FIX/index.html"

permissions:
  contents: read

jobs:
  mobile-nav-390:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate current V172 candidate
        run: python scripts/create_v172_csp_image_fix.py

      - name: Start local server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/gh-http.log 2>&1 &
          sleep 2

      - name: Reproduce 390px mobile navigation overlap
        env:
          GH_MOBILE_NAV_URL: http://127.0.0.1:4173/checkpoints/V172_CSP_IMAGE_FIX/index.html
        run: node scripts/gh_mobile_nav_runtime.mjs

      - name: Upload mobile navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-horse-v173-mobile-nav-red
          path: |
            mobile-nav-report.json
            mobile-nav-390*.png
            checkpoints/V172_CSP_IMAGE_FIX/index.html
          if-no-files-found: ignore
          retention-days: 3
